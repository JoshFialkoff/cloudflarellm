# Assistedly.ai vhost for dify-nginx on the co-located production host.
#
# Install on origin (requires sudo):
#   sudo cp scripts/deploy/nginx-assistedly.conf /etc/dify/nginx/conf.d/assistedly.conf
#   sudo nginx -t  # run inside dify-nginx-1, or restart nginx after copy
#   sudo docker exec dify-nginx-1 nginx -t && sudo docker exec dify-nginx-1 nginx -s reload
#
# TLS files on host (bind-mounted to /etc/ssl inside dify-nginx-1):
#   /etc/dify/nginx/ssl/assistedly.crt
#   /etc/dify/nginx/ssl/assistedly.key
# Use a Cloudflare Origin Certificate or Let's Encrypt cert covering:
#   assistedly.ai, www.assistedly.ai, agent2.assistedly.ai, agent3.assistedly.ai
#
# /guide is excluded so WordPress or another upstream can own that path later.

server {
    listen 80;
    server_name assistedly.ai www.assistedly.ai agent2.assistedly.ai agent3.assistedly.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name assistedly.ai www.assistedly.ai agent2.assistedly.ai agent3.assistedly.ai;

    ssl_certificate /etc/ssl/assistedly.crt;
    ssl_certificate_key /etc/ssl/assistedly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /guide {
        return 404;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assistedly_upstream assistedly-web:3003;
        proxy_pass http://$assistedly_upstream;
        include proxy.conf;
    }
}
