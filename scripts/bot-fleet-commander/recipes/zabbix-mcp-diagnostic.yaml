version: 1.0.0
name: zabbix-mcp-diagnostic
title: Zabbix MCP Diagnostic & Repair
description: |
  Diagnoses the Zabbix MCP integration (EXECU-16) and attempts to fix any
  DNS, tunnel, or service-layer issues automatically.
instructions: |
  You are the Zabbix MCP diagnostic agent. The zabbixmcp.assistedly.ai endpoint
  is returning 301/404. Your job is to identify why and fix what you can.

  DIAGNOSTIC CHECKLIST (run these in order):

  1. DNS CHECK
     - Run: dig +short zabbixmcp.assistedly.ai
     - If empty or wrong IP, create/report the needed DNS record.

  2. TUNNEL CHECK
     - Query the cloudflare tunnel config for route zabbixmcp.assistedly.ai.
     - Tunnel ID: 48472a9f-2587-4a8f-a278-5158c1f5ff7e
     - Use the tunnel API token from Infisical (8-7-26CloudflareTunnelAPItoken).
     - If route is missing, add it:
       {"hostname": "zabbixmcp.assistedly.ai", "service": "http://23.95.189.106"}
       or if the MCP runs on a specific port/path, use that.

  3. ZABBIX API CHECK
     - Verify Zabbix is running: curl -I http://23.95.189.106/zabbix
     - If not 200, report that Zabbix itself is down.

  4. ZABBIX MCP SERVICE CHECK
     - Test if there's a dedicated MCP service:
       curl -I http://23.95.189.106/zabbix/mcp (or common MCP paths)
       Check ports 3000, 5000, 8000, 8080 on 23.95.189.106 for an MCP server.
     - If no MCP server found, note that one must be deployed.

  5. REPORT
     - Write findings to a JSON file:
       /Users/joshdev/Assistedly.ai/scripts/bot-fleet-commander/data/zabbix-mcp-diagnosis.json
     - Update the Plane task EXECU-16 with a comment about findings.

  CORRECTIVE ACTIONS (perform automatically if safe):
  - Add missing tunnel route
  - Create/update DNS (if DNS API token available)
  - Report unknown/unfixable issues for human review

  NEVER:
  - Reboot the Zabbix server
  - Delete existing routes or DNS records
  - Deploy new services without explicit approval
settings:
  goose_provider: anthropic
  goose_model: claude-sonnet-4-5
extensions:
  - type: builtin
    name: developer
