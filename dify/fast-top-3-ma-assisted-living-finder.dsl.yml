app:
  description: >-
    6-13-26 Fast Top-3 MA Assisted Living Finder for assistedly.ai. Production
    runs in-repo via CHAT_ENGINE=native (see lib/fastTop3WorkflowConfig.js) —
    no live Dify app required. This DSL remains the source-of-truth for prompts
    and can still be imported to Dify Studio if needed.
  icon: 🤖
  icon_background: '#EFF1F5'
  icon_type: emoji
  mode: advanced-chat
  name: 03-04-26 Fast Top-3 MA Assisted Living Finder
  use_icon_as_answer_icon: true
kind: app
version: '0.6.0'
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: >-
      Ask a question about finding assisted living or memory care in Massachusetts
      (you'll get top 3 only).
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - Find assisted living for a 75 year old with dementia and memory loss in 01890. Budget $10000/month. Move-in within 1 month.
      - Find the best memory care options near Lexington MA for someone who wanders. Budget $12000/month.
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInLoop: false
          sourceType: start
          targetType: knowledge-retrieval
        id: ft3-start-retrieve
        source: ft3-start
        sourceHandle: source
        target: ft3-retrieve
        targetHandle: target
        type: custom
      - data:
          isInLoop: false
          sourceType: knowledge-retrieval
          targetType: llm
        id: ft3-retrieve-llm
        source: ft3-retrieve
        sourceHandle: source
        target: ft3-llm
        targetHandle: target
        type: custom
      - data:
          isInLoop: false
          sourceType: llm
          targetType: answer
        id: ft3-llm-answer
        source: ft3-llm
        sourceHandle: source
        target: ft3-answer
        targetHandle: target
        type: custom
    nodes:
      - data:
          title: Start
          type: start
          variables:
            - label: Monthly Budget
              max_length: 48
              required: false
              type: number
              variable: monthly_budget
            - label: Urgency
              max_length: 48
              required: false
              type: text-input
              variable: how_urgent
            - label: Location
              max_length: 48
              required: true
              type: text-input
              variable: Location
        id: ft3-start
        type: custom
      - data:
          title: Knowledge Retrieval
          type: knowledge-retrieval
          dataset_ids: []
          desc: Native engine uses lib/facilityRetrievalContext (MA facility catalog).
          query_variable_selector:
            - sys
            - query
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 3
            reranking_enable: false
        id: ft3-retrieve
        type: custom
      - data:
          title: Fast Top-3 LLM
          type: llm
          context:
            enabled: true
            variable_selector:
              - ft3-retrieve
              - result
          model:
            mode: chat
            name: gpt-4o-mini
            provider: langgenius/openai/openai
            completion_params:
              temperature: 0.1
              top_p: 0.9
          prompt_template:
            - id: ft3-sys
              role: system
              text: |
                Massachusetts AI Assisted Living Consumer Advocate — top 3 only, rest in ONE follow-up.

                Context: {{#context#}}
                Budget: {{#ft3-start.monthly_budget#}}
                Urgency: {{#ft3-start.how_urgent#}}
                Location: {{#ft3-start.Location#}}
                Question: {{#sys.query#}}

                Rules: No promotion/guarantees; no hidden reasoning. Unknown compliance → Unknown. NO follow-up questions!

                Top 3 matches:
                1) <Facility> — <Town>
                   - Memory care: <Yes/No/Unknown>
                   - Why (≤12 words)
                2) <Facility> — <Town>
                   - Memory care: <Yes/No/Unknown>
                   - Why (≤12 words)
                3) <Facility> — <Town>
                   - Memory care: <Yes/No/Unknown>
                   - Why (≤12 words)
                NEVER ask a follow up question!!
          vision:
            enabled: false
        id: ft3-llm
        type: custom
      - data:
          title: Answer
          type: answer
          answer: |
            Based on your goal of finding assisted living in {{#ft3-start.Location#}} for ${{#ft3-start.monthly_budget#}} per month {{#ft3-start.how_urgent#}}, here are your best options:

            {{#ft3-llm.text#}}
        id: ft3-answer
        type: custom
    viewport:
      x: 0
      y: 0
      zoom: 0.85
