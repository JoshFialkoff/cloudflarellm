# Recipe: partner-pilot-trigger
# Triggered when agentic outreach bot receives a positive partner response.
# This recipe exercises all 5 sub-agent skills and posts to Discord.

name: partner-pilot-trigger
description: >
  One-shot recipe that runs the full Partner Pilot pipeline when a partner
  responds positively to agentic outreach. Activates partner, generates
  artifacts, and notifies Discord.

env:
  DISCORD_PARTNER_PILOT_WEBHOOK: "{{DISCORD_PARTNER_PILOT_WEBHOOK}}"

steps:
  - name: validate-and-activate
    description: >
      Run the orchestrator script to validate the partner, optionally activate,
      and generate all work artifacts (research brief, dev checklist, content
      specs, analytics tags, PM stories).
    command: |
      cd /Users/joshdev/Assistedly.ai
      node scripts/partner-pilot-orchestrator.js \
        --partner="{{PARTNER_SLUG}}" \
        --source="{{RESPONSE_SOURCE}}" \
        --confidence="{{CONFIDENCE}}" \
        {{ACTIVATE_FLAG}}
    expects:
      - "✅ ALL PHASES COMPLETE"

  - name: discord-confirm
    description: >
      Post a follow-up confirmation to Discord with artifact file listing.
    command: |
      curl -s -X POST "${DISCORD_PARTNER_PILOT_WEBHOOK}" \
        -H "Content-Type: application/json" \
        -d '{
          "username": "Partner Pilot Bot",
          "embeds": [{
            "title": "📦 Pipeline Complete",
            "description": "All artifacts generated for **{{PARTNER_SLUG}}**.",
            "color": 4893695,
            "fields": [
              {"name": "Research Brief", "value": "`docs/partner-pilot/responses/{{PARTNER_SLUG}}-research-brief.json`", "inline": true},
              {"name": "Dev Checklist", "value": "`docs/partner-pilot/responses/{{PARTNER_SLUG}}-dev-checklist.json`", "inline": true},
              {"name": "Content Specs", "value": "`docs/partner-pilot/responses/{{PARTNER_SLUG}}-content-spec.json`", "inline": true},
              {"name": "Analytics Tags", "value": "`docs/partner-pilot/responses/{{PARTNER_SLUG}}-analytics.json`", "inline": true},
              {"name": "PM Stories", "value": "`docs/partner-pilot/responses/{{PARTNER_SLUG}}-pm-stories.json`", "inline": true}
            ],
            "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",
            "footer": {"text": "Assistedly.ai Partner Pilot"}
          }]
        }'
