version: 1.2.0
title: Calendar-Plane Task Priority Agent
description: |
  Analyzes your Google Calendar free time blocks and Plane open tasks to
  recommend the next most urgent and important stories to work on.

instructions: |
  STEP 1 — Environment (auto-loaded):
    All scripts auto-source Infisical rendered env from:
      `~/.infisical/rendered/.env`
    Required variables:
      - PLANE_BASE_URL (e.g. http://23.95.189.106)
      - PLANE_API_KEY
      - PLANE_WORKSPACE
      - PLANE_PROJECT_IDS (comma-separated)
      - GOOGLE_CALENDAR_ID (default: primary)
    Optional:
      - GOOGLE_SERVICE_ACCOUNT_JSON — service-account key JSON (with domain-wide
        delegation for josh@forwardjump.com) preferred over OAuth
      - GOOGLE_CREDENTIALS_PATH — path to an OAuth `client_secret.json`
      - GOOGLE_TOKEN_PATH — auto-generated on first OAuth run
      - DISCORD_CALENDAR_WEBHOOK_URL — to post scheduled results to Discord
      - DISCORD_BOT_TOKEN — for the interactive Discord bot
      - DISCORD_CHANNEL_ID — channel the bot listens in

  STEP 2 — Google Calendar Auth (pick one):
    A) Service Account (headless, no browser) — requires Workspace admin to
       grant domain-wide delegation for Calendar API scope.
    B) OAuth Desktop App — place `client_secret.json` next to `scheduler.py`
       and run once interactively:
         ```bash
         /Users/joshdev/Assistedly.ai/scripts/calendar-task-priority/run.sh --hours 12
         ```
       A browser window will open for Google consent. After that, `token.json`
       is saved and reused automatically.

  OPTION A — WORKSPACE ADMIN SETUP (Domain-Wide Delegation)
    Who can do this: A Google Workspace Super Admin for forwardjump.com.
    Estimated time: 3 minutes.

    1) Get the OAuth 2.0 Client ID (numeric):
       a) Open Google Cloud Console Service Accounts page for the project:
          https://console.cloud.google.com/iam-admin/serviceaccounts?project=n8n-416-23
       b) Find the service account:
          `id-1-6-25-google-analytics-mcp@n8n-416-23.iam.gserviceaccount.com`
       c) Click it → open the Details tab.
       d) Copy the value labeled OAuth 2.0 Client ID (long number, e.g. 123456789...).
          ⚠️ Do NOT paste the email address in Step 2; Admin Console requires
             the numeric Client ID.

    2) Grant domain-wide authority in Google Admin Console:
       a) Open Security → Access and data control → API controls:
          https://admin.google.com/ac/owl
       b) In the Domain-wide delegation pane, click Manage Domain Wide Delegation:
          https://admin.google.com/ac/owl/domainwidedelegation
       c) Click Add new.
       d) Client ID: paste the numeric Client ID from Step 1.
       e) OAuth scopes (comma-delimited):
          https://www.googleapis.com/auth/calendar.readonly
       f) Click Authorize.
       g) Wait 1-5 minutes for propagation, then re-run the scheduler.
          ```bash
          launchctl start com.aiassistliving.calendar-task-priority
          ```
          or run manually:
          ```bash
          /Users/joshdev/Assistedly.ai/scripts/calendar-task-priority/run.sh --hours 12
          ```

    3) Verify it worked:
       You should see `[Calendar] Fetched X events...` in the output
       instead of `unauthorized_client`.

  STEP 3 — Run the scheduler:
    ```bash
    /Users/joshdev/Assistedly.ai/scripts/calendar-task-priority/run.sh --hours 12 --output all --snapshot data/last_schedule.json
    ```

    Modes:
      `--output console`    → human-readable to terminal (default)
      `--output json`       → raw JSON
      `--output discord`    → post rich embed to Discord webhook
      `--output all`        → console + json + discord
      `--snapshot PATH`     → persist JSON to disk

  STEP 4 — Interpret the result:
    The output shows:
    1. Next upcoming meeting (your deadline)
    2. 🔥 NEXT ACTION — the single highest-score task from Plane
    3. A time-block schedule mapping each free gap to a recommended task
    4. Plane's top open tasks (shown even when Calendar is offline)
       Overdue tasks are marked (OVERDUE).

  ONE-SHOT RUN (from project root):
    ```bash
    scripts/calendar-task-priority/run.sh --hours 12
    ```

  SCHEDULING:
    A launchd job is installed and runs twice daily (9 AM and 1 PM ET):
      `com.aiassistliving.calendar-task-priority`
    To verify it is active:
      ```bash
      launchctl list | grep calendar-task-priority
      ```

  DISCORD BOT — Interactive Queries:
    A Discord bot runs continuously and responds to messages in the configured
    channel (DISCORD_CHANNEL_ID). You can ask it things like:
      - "what should I work on"
      - "what's the next task"
      - "next task"
      - "!next"
      - "!tasks"
      - "!priority"

    It replies with a rich embed showing:
      - 🔥 Next Action recommendation
      - 📋 Top 3 open tasks
      - Calendar lookahead summary

    To check the bot is running:
      ```bash
      launchctl list | grep calendar-task-priority.bot
      ```

  TROUBLESHOOTING:
    - `[403] unauthorized_client` for Google Calendar (service account):
      Domain-wide delegation is not enabled. Follow the "OPTION A" steps above.
      The most common mistake is entering the service account email instead of
      the numeric OAuth 2.0 Client ID in the Admin Console field.
    - `[403] Insufficient Permission` for Google Calendar (OAuth):
      Delete token.json and re-run to re-authorize with calendar scope.
    - `[401] Authentication credentials were not provided` for Plane:
      Refresh PLANE_API_KEY in Plane UI and update Infisical.
      Then run: `bash ~/.infisical/export-secrets.sh` if needed.
    - No free blocks found:
      Check that your calendar actually has gaps, or widen --hours.
    - Missing Google API libraries:
      `pip install google-auth-oauthlib google-auth-httplib2 google-auth google-api-python-client`
    - Webhook posts fail with 403 / error code 1010:
      Discord blocks requests without User-Agent. The scheduler now sends one
      automatically (AssistedlyCalendarBot/1.0). If you still see this, verify
      the webhook URL is still valid.
    - Bot fails with `ModuleNotFoundError: No module named 'discord'`:
      The bot requires `/usr/bin/python3` (the system Python where discord.py
      is installed). Check `run-bot.sh` resolves to the correct interpreter.

settings:
  goose_provider: orcarouter
  goose_model: orcarouter/auto

extensions:
  - type: builtin
    name: developer
