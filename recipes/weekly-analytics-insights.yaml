version: 1.2.0
title: Weekly Analytics Insights — LLM Mention Trend Detection
description: |
  Runs the full analytics-insight-monitor with a 7-day lookback (LOOKBACK_HOURS=168)
  to detect trends across:
  - DataForSEO LLM platform mentions of assistedly.ai
  - PostHog event volume anomalies (intake, search, chat, wizard)
  - GA4 key-events funnel integrity (with ai_referrer custom dimension)
  - Cloudflare Worker health & exception trends

  Outputs a strategy brief JSON for downstream strategy agents and posts
  a summary to Discord. This is primarily for AI/LLM mention trend monitoring
  and cross-provider analytics reconciliation.

instructions: |
  STEP 1 — Verify secrets via Infisical:
    ```bash
    cd /Users/joshdev/Assistedly.ai
    INFISICAL_DOMAIN=https://secrets.assistedly.ai infisical run --env=dev -- env | grep -E 'POSTHOG_API_KEY|POSTHOG_PROJECT_ID|DATAFORSEO|GA4|GOOGLE_SERVICE'
    ```

  STEP 2 — Run the weekly analytics monitor:
    ```bash
    cd /Users/joshdev/Assistedly.ai
    INFISICAL_DOMAIN=https://secrets.assistedly.ai infisical run --env=dev -- npm run ci:analytics:weekly
    ```

    This command will:
    1. Inject all required secrets (PostHog, DataForSEO, GA4, Cloudflare)
    2. Run scripts/ci/analytics-insight-monitor.mjs with LOOKBACK_HOURS=168
    3. Query DataForSEO for LLM mentions of assistedly.ai over the last 7 days
    4. Query PostHog HogQL for event volume + funnel trends
    5. Query GA4 Data API for key-events + ai_referrer segmentation
    6. Query Cloudflare Worker health + exception logs
    7. Write strategy brief JSON to .goose/weekly-insights-brief.json
    8. Post summary Discord alert (to the configured analytics webhook)

  STEP 3 — Review the strategy brief:
    ```bash
    cat .goose/weekly-insights-brief.json | python3 -m json.tool | head -n 80
    ```

  TROUBLESHOOTING:
    - If DataForSEO returns "total_count: 0", it means assistedly.ai has zero
      tracked LLM mentions for the period. This is expected until content
      saturation improves.
    - If GA4 returns INVALID_ARGUMENT on ai_referrer, verify the custom dimension
      is registered (properties/470773585/customDimensions/15489247235).
    - If Discord alert fails, check that DISCORD_ANALYTICS_WEBHOOK_URL is set
      in Infisical for the active environment.
    - For dry-run (stdout only), prepend ANALYTICS_MONITOR_SKIP_DISCORD=1.

settings:
  goose_provider: orcarouter
  goose_model: orcarouter/auto

extensions:
  - type: builtin
    name: developer
