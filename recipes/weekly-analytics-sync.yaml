version: 1.2.0
title: Weekly Analytics Sync — PostHog to Cloudflare D1
description: |
  Aggregates anonymous facility-search events from PostHog (last 7 days)
  and writes them to Cloudflare D1 (assistedly-analytics database).

  This powers the Facility Intelligence Dashboard with live data on:
  - search impressions, clicks, CTR
  - filter preferences (radius, fee, tax status, memory care, insurance)
  - sort preferences
  - geographic search origins

  All data is pre-hashed and anonymized. No PII is stored.

instructions: |
  STEP 1 — Verify PostHog API credentials:
    Ensure POSTHOG_PERSONAL_API_KEY and POSTHOG_PROJECT_ID are available
    via Infisical in the dev environment at secrets.assistedly.ai.

    Check:
    ```bash
    INFISICAL_DOMAIN=https://secrets.assistedly.ai infisical run --env=dev -- env | grep POSTHOG
    ```

  STEP 2 — Run the sync pipeline:
    ```bash
    cd /Users/joshdev/Assistedly.ai
    INFISICAL_DOMAIN=https://secrets.assistedly.ai infisical run --env=dev -- npm run sync:analytics
    ```

    This command will:
    1. Fetch POSTHOG_PERSONAL_API_KEY and POSTHOG_PROJECT_ID from Infisical
    2. Query PostHog HogQL API for facility_search, facility_click, facility_sort
       events from the last 7 days
    3. Hash session IDs with FNV-1a (anonymization)
    4. Build SQL INSERT statements for D1 search_sessions table
    5. Execute via wrangler d1 execute --remote --config wrangler-slot4.toml
    6. Clean up temporary SQL file

  STEP 3 — Verify D1 has fresh data:
    ```bash
    CLOUDFLARE_ACCOUNT_ID=ad9d77d8f16147c01ff26b56d41cb5a9 \
      npx wrangler d1 execute assistedly-analytics --remote --config wrangler-slot4.toml \
      --command "SELECT date, COUNT(*) as sessions FROM search_sessions WHERE date >= date('now', '-7 days') GROUP BY date ORDER BY date;"
    ```
    Expect: rows with recent dates and non-zero session counts.

  STEP 4 (Optional) — Deploy with data refresh:
    ```bash
    npm run sync:analytics:deploy
    ```
    This runs sync + build + deploy in one shot.

  MANUAL ONE-SHOT RUN (same as schedule):
    ```bash
    cd /Users/joshdev/Assistedly.ai && INFISICAL_DOMAIN=https://secrets.assistedly.ai infisical run --env=dev -- npm run sync:analytics
    ```

  TROUBLESHOOTING:
    - If PostHog API returns 401, the POSTHOG_PERSONAL_API_KEY may be expired.
      Generate a new one at https://us.posthog.com/settings/user-api-keys
      and update it in Infisical.
    - If D1 execute fails, verify wrangler-slot4.toml has the correct binding:
      [[d1_databases]]
      binding = "assistedly_analytics"
      database_name = "assistedly-analytics"
      database_id = "fa630e9b-d7e2-4919-ad5b-cc3f9f69da44"
    - If no events are found, verify tracking is working:
      Open https://assistedly.ai/find-safest, use the chart filters,
      then check PostHog Live Events for "facility_search" events.
    - If D1 is empty after sync, check the sync script output for HogQL errors.

  SECURITY RULES:
    - Never commit POSTHOG_PERSONAL_API_KEY to git.
    - Never log session IDs before hashing.
    - D1 queries should only aggregate — never return raw session data.

settings:
  goose_provider: orcarouter
  goose_model: orcarouter/auto

extensions:
  - type: builtin
    name: developer
