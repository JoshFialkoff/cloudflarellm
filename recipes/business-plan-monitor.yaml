name: business-plan-monitor
icon: 📋
description: |
  Monitors Goose chat history for strategic insights and appends synthesized
  updates to the Assistedly business plan Google Docs.

targets:
  - name: run-monitor
    command: |
      cd /Users/joshdev/Assistedly.ai &&       INFISICAL_DOMAIN=https://secrets.assistedly.ai       infisical run --env=dev --       node scripts/business-plan-monitor.cjs

prompt: |
  Run the business plan monitor bot. It will scan recent chats for strategic,
  product, competitive, and operational insights, then append formatted updates
  to both Google Docs. Check the output for success/failure of each section.

schedule: 0 9 * * 1
# Runs every Monday at 9:00 AM ET
