name: seo-analytics-fixer
description: |
  Ensures Google Analytics 4, Cloudflare Web Analytics, and PostHog
  are installed, configured, and verifying correctly across all public
  properties. Handles wrangler.toml vars, GTM container validation,
  and subdomain analytics coverage.

instructions: |
  ## Scope
  - Verify GA4, GTM, PostHog, and Cloudflare Web Analytics presence
  - Add missing [vars] to wrangler.toml for server-side analytics
  - Configure Cloudflare Web Analytics for subdomains
  - Validate event taxonomy alignment across PostHog → GA4 → Google Ads
  
  ## Rules
  - NEVER print API keys, tokens, or measurement IDs in chat
  - Use Infisical for secret injection: `infisical run --env=dev -- ...`
  - When editing wrangler.toml, preserve existing bindings (D1, KV, assets)
  - Rebuild and redeploy ONLY after running guard scripts
  
  ## Verification Steps
  1. Curl pages grep for GTM, gtag, posthog init, CF beacon
  2. Check GTM Preview mode before GA4 Realtime
  3. Verify CF Web Analytics token is in zone RUM settings
