version: "3.8"

services:
  assistedly-secure-mcp:
    image: assistedly-secure-mcp:latest
    container_name: assistedly-secure-mcp
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - mcp-internal
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=production
      - MCP_JWT_SECRET=${MCP_JWT_SECRET:?JWT secret required}
      - FACILITY_DATA_PATH=/app/public/data/chart-facilities.json
      - NOCODB_URL=http://23.95.189.106:8080
      - NOCODB_TOKEN=${NOCODB_TOKEN:-}
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    volumes:
      - ./data/chart-facilities.json:/app/public/data/chart-facilities.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  mcp-internal:
    driver: bridge
    internal: false
