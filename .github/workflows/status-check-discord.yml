# Scheduled production HTTP checks with a short summary posted to Discord.
#
# GitHub → Settings → Secrets and variables → Actions (recommended):
#   DISCORD_STATUS_WEBHOOK_URL — Incoming Webhook URL for a #status (or similar) channel.
# If unset, falls back to DISCORD_GITHUB_UPDATES_WEBHOOK_URL, then DISCORD_DEPLOY_WEBHOOK_URL.

name: Status check → Discord

# Opt into Node 24 for JS actions (matches ci-cd.yml; avoids Node 20 deprecation warnings on checkout/setup-node).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Every 6 hours UTC (adjust as needed)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: status-check-discord-${{ github.repository }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run production checks and notify Discord
        env:
          STATUS_BASE_URL: https://assistedly.ai
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_GITHUB_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK_URL }}
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: node scripts/ci/status-check-discord.mjs
