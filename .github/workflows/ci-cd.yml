# CI on every push/PR. On main, after CI passes, trigger Easypanel (optional) and require Cloudflare purge.
#
# GitHub → repository → Settings → Secrets and variables → Actions:
#   EASYPANEL_DEPLOY_HOOK_URL   — full URL from Easypanel service → Deploy → Deploy hook (GET).
#   CLOUDFLARE_ZONE_ID          — required for main deploy; Zone ID from Cloudflare dashboard overview.
#   CLOUDFLARE_API_TOKEN        — required for main deploy; token with Zone.Cache Purge (or Cache Purge — Purge).
#   DISCORD_DEPLOY_WEBHOOK_URL  — recommended; channel Incoming Webhook for automatic “deploy finished” (and deploy failed) posts after main deploy.

name: CI / CD

# Opt into Node 24 for JS actions before GitHub removes Node 20 (see Actions deprecation notices).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start app for smoke test
        run: |
          PORT=3000 npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to start for smoke test."
          cat /tmp/next-start.log || true
          exit 1

      - name: Smoke test homepage
        run: npm run smoke:homepage

      - name: Stop smoke test app
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then
            kill "$(cat /tmp/next-start.pid)" || true
          fi
  automerge:
    needs: build
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash) for labeled PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                clientMutationId
              }
            }
          ' -f id="${PR_NODE_ID}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel deploy
        env:
          HOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${HOOK_URL}" ]; then
            echo "::warning::EASYPANEL_DEPLOY_HOOK_URL is not set; Easypanel will not be triggered from CI."
            exit 0
          fi
          # Easypanel deploy hooks are typically invoked with GET.
          curl -fsS --max-time 120 -X GET "$HOOK_URL"

      - name: Purge Cloudflare cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${ZONE_ID}" ] || [ -z "${API_TOKEN}" ]; then
            echo "::error::Cloudflare purge required on main deploy. Set CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          RESPONSE="$(curl -fsS --max-time 120 -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "${RESPONSE}" | jq -e '.success == true' >/dev/null || {
            echo "::error::Cloudflare purge failed: ${RESPONSE}"
            exit 1
          }

      - name: Notify Discord (deploy finished)
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::notice::Set Actions secret DISCORD_DEPLOY_WEBHOOK_URL to post deploy updates to Discord."
            exit 0
          fi
          FIRST_LINE="$(printf '%s\n' "${COMMIT_MSG:-}" | head -n 1)"
          SITE="https://assistedly.ai/"
          BODY="$(jq -n \
            --arg repo "${REPO}" \
            --arg sha "${SHA}" \
            --arg url "${RUN_URL}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg sub "${FIRST_LINE}" \
            --arg actor "${ACTOR}" \
            --arg site "${SITE}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '($sub | if length > 240 then .[0:240] + "…" else . end) as $short |
            {
              username: "Assistedly Deploy",
              embeds: [{
                title: "Deploy finished",
                description: ("**" + $repo + "**\n`" + ($sha | .[0:7]) + "` — " + (if ($short | length) > 0 then $short else "(no commit message)" end)),
                color: 3066993,
                url: $url,
                fields: [
                  {name: "Site", value: $site, inline: true},
                  {name: "Author", value: $actor, inline: true},
                  {name: "Commit", value: ("[diff](" + $commit_url + ")"), inline: true},
                  {name: "Workflow", value: ("[view run](" + $url + ")"), inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: $ts
              }]
            }')"
          curl -fsS --max-time 30 -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"

  notify-deploy-failure:
    needs: deploy
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (deploy failed)
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::notice::Set DISCORD_DEPLOY_WEBHOOK_URL to alert Discord on deploy failures."
            exit 0
          fi
          BODY="$(jq -n \
            --arg repo "${REPO}" \
            --arg sha "${SHA}" \
            --arg url "${RUN_URL}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg actor "${ACTOR}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "Assistedly Deploy",
              embeds: [{
                title: "Deploy failed",
                description: ("**" + $repo + "** — Easypanel hook, Cloudflare purge, or a deploy step failed.\n`" + ($sha | .[0:7]) + "`"),
                color: 15158332,
                url: $url,
                fields: [
                  {name: "Author", value: $actor, inline: true},
                  {name: "Commit", value: ("[view](" + $commit_url + ")"), inline: true},
                  {name: "Workflow", value: ("[logs](" + $url + ")"), inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: $ts
              }]
            }')"
          curl -fsS --max-time 30 -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"
