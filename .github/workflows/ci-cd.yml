# CI on every push/PR. On main, after CI passes, trigger Easypanel (optional) and require Cloudflare purge.
#
# GitHub → repository → Settings → Secrets and variables → Actions:
#   EASYPANEL_DEPLOY_HOOK_URL   — full URL from Easypanel service → Deploy → Deploy hook (GET).
#   CLOUDFLARE_ZONE_ID          — required for main deploy; Zone ID from Cloudflare dashboard overview.
#   CLOUDFLARE_API_TOKEN        — required for main deploy; token with Zone.Cache Purge (or Cache Purge — Purge).
#   DISCORD_DEPLOY_WEBHOOK_URL  — optional; Discord channel webhook URL for deploy notifications (POST JSON).

name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into Node 24 for JS actions before GitHub removes Node 20 (see Actions deprecation notices).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel deploy
        env:
          HOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${HOOK_URL}" ]; then
            echo "::warning::EASYPANEL_DEPLOY_HOOK_URL is not set; Easypanel will not be triggered from CI."
            exit 0
          fi
          # Easypanel deploy hooks are typically invoked with GET.
          curl -fsS --max-time 120 -X GET "$HOOK_URL"

      - name: Purge Cloudflare cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${ZONE_ID}" ] || [ -z "${API_TOKEN}" ]; then
            echo "::error::Cloudflare purge required on main deploy. Set CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          RESPONSE="$(curl -fsS --max-time 120 -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "${RESPONSE}" | jq -e '.success == true' >/dev/null || {
            echo "::error::Cloudflare purge failed: ${RESPONSE}"
            exit 1
          }

      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "Discord notify skipped (DISCORD_DEPLOY_WEBHOOK_URL not set)."
            exit 0
          fi
          FIRST_LINE="$(printf '%s\n' "${COMMIT_MSG}" | head -n 1)"
          BODY="$(jq -n \
            --arg repo "${REPO}" \
            --arg sha "${SHA}" \
            --arg url "${RUN_URL}" \
            --arg sub "${FIRST_LINE}" \
            '{content: ("**Deployment finished** — `" + $repo + "` @ `" + ($sha | .[0:7]) + "`\n" + $sub + "\n<" + $url + ">")}')"
          curl -fsS --max-time 30 -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"
