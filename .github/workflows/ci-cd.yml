name: CI / CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DEPLOY_HOST: 104.168.38.162

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate deploy secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::DEPLOY_KEY secret is not set."
            exit 1
          fi

      - name: Trigger deploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          node scripts/ci/trigger-deploy.mjs --host "${DEPLOY_HOST}"

      - name: Origin smoke with retries
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --head --resolve assistedly.ai:443:${DEPLOY_HOST} https://assistedly.ai/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Origin smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Origin smoke failed after 3 attempts."
          exit 1

      - name: Purge Cloudflare cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_PURGE_REQUIRED: "0"
        run: |
          node scripts/ci/purge-cloudflare.mjs

      - name: Production smoke with retries
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          PRODUCTION_SMOKE_URL: https://assistedly.ai/
        run: |
          for attempt in 1 2 3; do
            if npm run smoke:production; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Production smoke failed after 3 attempts."
          exit 1
