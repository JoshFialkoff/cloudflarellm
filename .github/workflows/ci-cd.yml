name: CI / CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate deploy secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::DEPLOY_KEY secret is not set."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN must be set."
            exit 1
          fi

      - name: Configure SSH
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          TARGET_HOST_RAW="${DEPLOY_SSH_HOST:-ssh.assistedly.ai}"
          TARGET_HOST="${TARGET_HOST_RAW#https://}"
          TARGET_HOST="${TARGET_HOST#http://}"
          TARGET_HOST="${TARGET_HOST%%/*}"
          if [ -z "${TARGET_HOST}" ]; then
            echo "::error::DEPLOY_SSH_HOST resolved to an empty hostname."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host ${TARGET_HOST}
            User opencode
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Trigger deploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          node scripts/ci/trigger-deploy.mjs --host "${DEPLOY_SSH_HOST:-ssh.assistedly.ai}"

      - name: Purge Cloudflare cache
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          node scripts/ci/purge-cloudflare.mjs

      - name: Production smoke with retries
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          PRODUCTION_SMOKE_URL: https://assistedly.ai/
        run: |
          for attempt in 1 2 3; do
            if npm run smoke:production; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Production smoke failed after 3 attempts."
          exit 1
