# CI on every push/PR. On main, after CI passes: Cloudflare cache purge (`scripts/ci/purge-cloudflare.mjs`),
# then production smoke. Production Next.js is deployed separately (SSH + Supervisor on the origin — see README);
# this workflow does not deploy the app binary to the host.
#
# GitHub → repository → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_ZONE_ID          — required for main deploy; Zone ID from Cloudflare dashboard overview.
#   CLOUDFLARE_API_TOKEN        — required for main deploy; token with Zone.Cache Purge (or Cache Purge — Purge).
#   DISCORD_GITHUB_UPDATES_WEBHOOK_URL — recommended; Incoming Webhook for GitHub-driven updates (main deploy success/failure embeds). Falls back to DISCORD_DEPLOY_WEBHOOK_URL.
#   DISCORD_DEPLOY_WEBHOOK_URL  — legacy fallback if DISCORD_GITHUB_UPDATES_WEBHOOK_URL is unset; same Incoming Webhook format.
#   DISCORD_STATUS_WEBHOOK_URL  — optional; Incoming Webhook for scheduled production status checks (see status-check-discord.yml). Falls back to deploy webhook if unset.

name: CI / CD

# Opt into Node 24 for JS actions before GitHub removes Node 20 (see Actions deprecation notices).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start app for smoke test
        run: |
          PORT=3000 npm run start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to start for smoke test."
          cat /tmp/next-start.log || true
          exit 1

      - name: Smoke test homepage
        run: npm run smoke:homepage

      - name: Stop smoke test app
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then
            kill "$(cat /tmp/next-start.pid)" || true
          fi
  automerge:
    needs: build
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash) for labeled PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                clientMutationId
              }
            }
          ' -f id="${PR_NODE_ID}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Cloudflare purge required on main deploy. Set CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          node scripts/ci/purge-cloudflare.mjs

      - name: Smoke production URL (edge not 5xx)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 25 https://assistedly.ai/)" || code="000"
            if [ "${code}" != "000" ] && [ "${code}" -lt 500 ] 2>/dev/null; then
              echo "Production smoke OK (HTTP ${code})"
              exit 0
            fi
            echo "attempt ${i}: HTTP ${code}, retry in 20s..."
            sleep 20
          done
          echo "::error::https://assistedly.ai/ still returned 5xx after retries (origin or Cloudflare edge issue?)."
          exit 1

      - name: Notify Discord (deploy finished)
        env:
          WEBHOOK_GITHUB: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK_URL }}
          WEBHOOK_DEPLOY: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          GH_HOST: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          TREE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          WEBHOOK="${WEBHOOK_GITHUB}"
          [ -n "${WEBHOOK}" ] || WEBHOOK="${WEBHOOK_DEPLOY}"
          if [ -z "${WEBHOOK}" ]; then
            echo "::notice::Set DISCORD_GITHUB_UPDATES_WEBHOOK_URL (or DISCORD_DEPLOY_WEBHOOK_URL) to post deploy updates to Discord."
            exit 0
          fi
          FIRST_LINE="$(printf '%s\n' "${COMMIT_MSG:-}" | head -n 1)"
          SITE="https://assistedly.ai/"
          ZERO=0000000000000000000000000000000000000000
          if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${ZERO}" ]; then
            COMPARE_URL="${GH_HOST}/${REPO}/compare/${BEFORE}...${SHA}"
            COMPARE_LABEL="[${BEFORE:0:7}…${SHA:0:7}](${COMPARE_URL})"
          else
            COMPARE_LABEL="[browse tree](${TREE_URL})"
          fi
          BODY="$(jq -n \
            --arg repo "${REPO}" \
            --arg sha "${SHA}" \
            --arg url "${RUN_URL}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg tree_url "${TREE_URL}" \
            --arg sub "${FIRST_LINE}" \
            --arg actor "${ACTOR}" \
            --arg site "${SITE}" \
            --arg branch "${REF_NAME}" \
            --arg compare_md "${COMPARE_LABEL}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '($sub | if length > 240 then .[0:240] + "…" else . end) as $short |
            {
              username: "GitHub → Discord",
              embeds: [{
                title: "Main deploy finished",
                description: ("**" + $repo + "** @ `" + $branch + "`\n`" + ($sha | .[0:7]) + "` — " + (if ($short | length) > 0 then $short else "(no commit message)" end)),
                color: 3066993,
                url: $url,
                fields: [
                  {name: "Site", value: $site, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Author", value: $actor, inline: true},
                  {name: "Commit", value: ("[view commit](" + $commit_url + ")"), inline: true},
                  {name: "Changes", value: $compare_md, inline: true},
                  {name: "Workflow", value: ("[logs](" + $url + ")"), inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: $ts
              }]
            }')"
          http_code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")" || true
          if [ "${http_code}" -ge 400 ] 2>/dev/null; then
            echo "::warning::Discord webhook returned HTTP ${http_code} (notifications skipped)"
          fi

  notify-deploy-failure:
    needs: deploy
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (deploy failed)
        env:
          WEBHOOK_GITHUB: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK_URL }}
          WEBHOOK_DEPLOY: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          GH_HOST: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          TREE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          WEBHOOK="${WEBHOOK_GITHUB}"
          [ -n "${WEBHOOK}" ] || WEBHOOK="${WEBHOOK_DEPLOY}"
          if [ -z "${WEBHOOK}" ]; then
            echo "::notice::Set DISCORD_GITHUB_UPDATES_WEBHOOK_URL (or DISCORD_DEPLOY_WEBHOOK_URL) to alert Discord on deploy failures."
            exit 0
          fi
          ZERO=0000000000000000000000000000000000000000
          if [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${ZERO}" ]; then
            COMPARE_URL="${GH_HOST}/${REPO}/compare/${BEFORE}...${SHA}"
            COMPARE_LABEL="[${BEFORE:0:7}…${SHA:0:7}](${COMPARE_URL})"
          else
            COMPARE_LABEL="[browse tree](${TREE_URL})"
          fi
          BODY="$(jq -n \
            --arg repo "${REPO}" \
            --arg sha "${SHA}" \
            --arg url "${RUN_URL}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg actor "${ACTOR}" \
            --arg branch "${REF_NAME}" \
            --arg compare_md "${COMPARE_LABEL}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "GitHub → Discord",
              embeds: [{
                title: "Main deploy failed",
                description: ("**" + $repo + "** @ `" + $branch + "` — Cloudflare purge, smoke check, or a deploy job step failed.\n`" + ($sha | .[0:7]) + "`"),
                color: 15158332,
                url: $url,
                fields: [
                  {name: "Author", value: $actor, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Commit", value: ("[view commit](" + $commit_url + ")"), inline: true},
                  {name: "Changes", value: $compare_md, inline: true},
                  {name: "Workflow", value: ("[logs](" + $url + ")"), inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: $ts
              }]
            }')"
          http_code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -X POST "${WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")" || true
          if [ "${http_code}" -ge 400 ] 2>/dev/null; then
            echo "::warning::Discord webhook returned HTTP ${http_code} (notifications skipped)"
          fi
