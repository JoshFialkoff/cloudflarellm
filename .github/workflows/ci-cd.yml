name: CI / CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set DEPLOY_HOST as a repository variable: Settings > Variables > Actions > DEPLOY_HOST
  # Cutover to 75.127.14.185: update DEPLOY_HOST variable and set DEPLOY_COMPOSE_FILE=compose.dify-host.yaml
  DEPLOY_HOST: '75.127.14.185'
  DEPLOY_COMPOSE_FILE: 'compose.dify-host.yaml'

jobs:
  critical-feature-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Critical Feature Guard
        run: node scripts/guard-critical-features.mjs

      - name: Critical Feature Guard Test Suite
        run: node scripts/ci/test-guard.mjs

  build:
    needs: [critical-feature-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-dependabot: ${{ steps.detect-dependabot.outputs.is_dependabot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Detect Dependabot commit
        id: detect-dependabot
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$AUTHOR_NAME" == "dependabot[bot]" ]] || \
             echo "$COMMIT_MSG" | grep -qE "^(Merge pull request #[0-9]+ from dependabot/|Bump .+ from .+ to [0-9]|deps: bump )"; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
            echo "Dependabot commit detected — deploy will require environment approval."
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          DEPLOY_USER: joshfialkoff
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::DEPLOY_KEY secret is not set."
            exit 1
          fi

  llm-safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run LLM Safety Guard
        run: |
          echo "Running LLM Safety Guard..."
          node recipes/llm-safety-guard/validate.js --mode=code
          node recipes/llm-safety-guard/validate.js --mode=ui

  deploy:
    needs: [build, llm-safety-check]
    permissions:
      contents: read
      deployments: write
      id-token: write  # Required for Infisical OIDC authentication
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    # Dependabot-authored merges route through the 'dependency-deploy' environment,
    # which must have required reviewers configured in repo Settings > Environments.
    # Regular commits route through 'production' (configure as needed).
    # See docs/dependency-updates.md for full setup instructions.
    environment: >-
      ${{ needs.build.outputs.is-dependabot == 'true' && 'dependency-deploy' || 'production' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: '75.127.14.185'
      DEPLOY_COMPOSE_FILE: 'compose.dify-host.yaml'
      DEPLOY_USER: joshfialkoff
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      # TODO: CLOUDFLARE_* are deprecated in GitHub Secrets.
      # Migrate to Infisical OIDC via the "Fetch Cloudflare token from Infisical" step.
      # Remove these lines once Infisical OIDC is confirmed in production.
      # TRACKING: https://secrets.assistedly.ai (env=prod, keys below)
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fetch Cloudflare token from Infisical
        # Fetches CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID at runtime via OIDC.
        # Set in Infisical: Identity ID + Project slug. Map to workflow variables below.
        # See AGENTS.md → "CI/CD + Infisical OIDC" for full setup.
        id: infisical
        uses: infisical/secrets-action@v1
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "prod"
        continue-on-error: true  # Remove after Infisical OIDC is confirmed working

      - name: Trigger deploy
        env:
          DEPLOY_COMPOSE_FILE: 'compose.dify-host.yaml'
        run: |
          node scripts/ci/trigger-deploy.mjs --host "${DEPLOY_HOST}"

      - name: Origin smoke with retries
        run: |
          for attempt in 1 2 3; do
            if curl -k --silent --show-error --fail --head --resolve assistedly.ai:443:${DEPLOY_HOST} https://assistedly.ai/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Origin smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Origin smoke failed after 3 attempts."
          exit 1

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          # Primary source: Infisical OIDC. Fallback: GitHub Secret (deprecated).
          apiToken: "${{ steps.infisical.outputs.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}"
          command: deploy --config wrangler-slot4.toml

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_PURGE_REQUIRED: "0"
        run: |
          node scripts/ci/purge-cloudflare.mjs

      - name: Production smoke with retries
        env:
          PRODUCTION_SMOKE_URL: https://assistedly.ai/
        run: |
          for attempt in 1 2 3; do
            if npm run smoke:production; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Production smoke failed after 3 attempts."
          exit 1
