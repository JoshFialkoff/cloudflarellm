# PostHog $exception digest → Cursor triage prompt → Discord updates channel.
#
# Secrets (repo → Settings → Actions):
#   POSTHOG_API_KEY — personal API key with query access
#   POSTHOG_PROJECT_ID — numeric project id
#   DISCORD_GITHUB_UPDATES_WEBHOOK_URL — Incoming Webhook for GitHub / CI updates (preferred)
# Optional:
#   POSTHOG_HOST — default https://us.posthog.com
#   DISCORD_POSTHOG_ERRORS_WEBHOOK_URL — dedicated webhook (overrides chain above)
#   DISCORD_DEPLOY_WEBHOOK_URL — fallback if updates webhook unset

name: PostHog errors → Cursor prompt → Discord

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Monday 14:00 UTC (~ weekly digest after weekend traffic)
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: posthog-errors-cursor-agent-${{ github.repository }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Query PostHog and notify Discord
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_ERROR_DIGEST_DAYS: "7"
          POSTHOG_ERROR_DIGEST_ORG: "AI Assisted Living Companion"
          DISCORD_POSTHOG_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_POSTHOG_ERRORS_WEBHOOK_URL }}
          DISCORD_GITHUB_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK_URL }}
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: node scripts/posthog-errors-cursor-agent.mjs
