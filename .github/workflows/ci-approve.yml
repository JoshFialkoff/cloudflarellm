name: CI / Approve to Production

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ci-approve-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  deployments: write

env:
  DEPLOY_HOST: '75.127.14.185'
  DEPLOY_COMPOSE_FILE: 'compose.dify-host.yaml'

jobs:
  deploy:
    if: (github.event_name == 'issue_comment' && contains(github.event.comment.body, '!!APPROVED')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: '75.127.14.185'
      DEPLOY_COMPOSE_FILE: 'compose.dify-host.yaml'
      DEPLOY_USER: joshfialkoff
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Get PR details
        if: github.event_name == 'issue_comment'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "Deploying PR #$PR_NUMBER ($HEAD_REF) @ $HEAD_SHA"

      - name: Checkout PR or main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.pr.outputs.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Trigger deploy to production
        env:
          DEPLOY_COMPOSE_FILE: 'compose.dify-host.yaml'
        run: |
          node scripts/ci/trigger-deploy.mjs --host "${DEPLOY_HOST}"

      - name: Origin smoke with retries
        run: |
          for attempt in 1 2 3; do
            if curl -k --silent --show-error --fail --head --resolve assistedly.ai:443:${DEPLOY_HOST} https://assistedly.ai/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Origin smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Origin smoke failed after 3 attempts."
          exit 1

      - name: Local Cloudflare Worker smoke
        run: |
          npx wrangler dev --config wrangler.toml --port 9876 &
          WRANGLER_PID=$!
          sleep 10
          curl -sf --retry 3 --retry-delay 5 http://localhost:9876/ >/dev/null || { echo "::error::Local Worker smoke failed"; kill $WRANGLER_PID; exit 1; }
          kill $WRANGLER_PID
          wait $WRANGLER_PID 2>/dev/null || true

      - name: Fetch Cloudflare token from Infisical
        id: infisical
        uses: infisical/secrets-action@v1
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "prod"
        continue-on-error: true

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: "${{ steps.infisical.outputs.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}"
        run: |
          npx wrangler deploy --config wrangler-slot4.toml

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_PURGE_REQUIRED: "0"
        run: |
          node scripts/ci/purge-cloudflare.mjs

      - name: Production smoke with retries
        env:
          PRODUCTION_SMOKE_URL: https://assistedly.ai/
        run: |
          for attempt in 1 2 3; do
            if npm run smoke:production; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Smoke failed (attempt $attempt/3). Retrying in 20s..."
              sleep 20
            fi
          done
          echo "::error::Production smoke failed after 3 attempts."
          exit 1
