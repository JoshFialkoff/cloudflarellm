name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Cloudflare skills
        run: npx -y skills add https://github.com/cloudflare/skills --skill cloudflare --agent '*' --yes

      - name: Configure Cloudflare MCP servers
        run: |
          cat > .mcp.json <<'JSON'
          {
            "mcpServers": {
              "cloudflare": { "url": "https://mcp.cloudflare.com/mcp" },
              "cloudflare-docs": { "url": "https://docs.mcp.cloudflare.com/mcp" },
              "cloudflare-bindings": { "url": "https://bindings.mcp.cloudflare.com/mcp" },
              "cloudflare-builds": { "url": "https://builds.mcp.cloudflare.com/mcp" },
              "cloudflare-observability": { "url": "https://observability.mcp.cloudflare.com/mcp" }
            }
          }
          JSON
