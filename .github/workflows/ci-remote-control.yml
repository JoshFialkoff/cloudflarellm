# Manual Cloudflare cache purge without running the full build matrix.
# Uses the same secrets as `.github/workflows/ci-cd.yml` (purge step).
#
# Trigger from GitHub UI: Actions → "CI remote control" → Run workflow
# Trigger from CLI: see `.cursor/rules/ci-cd-cloudflare.mdc`

name: CI remote control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-remote-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN must be set for cache purge."
            exit 1
          fi
          node scripts/ci/purge-cloudflare.mjs

      - name: Production smoke check
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke-production-url.cjs; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "Retrying production smoke in 15s (attempt ${attempt}/5 failed)..."
            sleep 15
          done
