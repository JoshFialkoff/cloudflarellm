name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Set CLOUDFLARE_API_KEY worker secret
        env:
          CF_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_KEY" ]; then
            echo "$CF_API_KEY" | npx wrangler secret put CLOUDFLARE_API_KEY
          else
            echo "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_KEY
          fi
      - name: Deploy to Cloudflare (with retry)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad9d77d8f16147c01ff26b56d41cb5a9
          WRANGLER_LOG: debug
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== Deploy attempt $attempt (rollout=immediate) ==="
            if npx wrangler deploy --containers-rollout=immediate; then
              echo "=== Deploy succeeded ==="
              exit 0
            fi
            echo "=== Deploy attempt $attempt failed; waiting 60s before retry ==="
            sleep 60
          done
          echo "=== Final attempt with rollout=none (lazy container start) ==="
          if npx wrangler deploy --containers-rollout=none; then
            echo "=== Deploy succeeded (lazy containers) ==="
            exit 0
          fi
          echo "=== Deploy failed after all attempts ==="
          exit 1
