name: Cloudflare Token Health Check

on:
  # Uncomment to enable weekly health checks:
  # schedule:
  #   - cron: "0 6 * * 0"  # Every Sunday at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no mutations)"
        type: boolean
        default: true
      revoke_old:
        description: "Revoke old token after rotation"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rotate-cloudflare-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Infisical CLI
        # Install pinned version of the Infisical CLI for Ubuntu
        run: |
          mkdir -p /tmp/infisical
          cd /tmp/infisical
          curl -LO https://github.com/Infisical/infisical/releases/latest/download/infisical_$(uname -s)_$(uname -m).tar.gz
          tar -xzf infisical_*.tar.gz
          chmod +x infisical
          sudo mv infisical /usr/local/bin/
          infisical --version

      - name: Rotate Cloudflare token
        env:
          INFISICAL_DOMAIN: "https://secrets.assistedly.ai"
          # Authenticate using the CI method configured in your Infisical instance.
          # For local dev: infisical login (already done by user)
          # For CI: set universal-auth, service-token, or OIDC before this step.
          DRY_RUN: "${{ inputs.dry_run && '1' || '0' }}"
          REVOKE_OLD: "${{ inputs.revoke_old && '1' || '0' }}"
        run: |
          infisical run --env=prod -- node scripts/ci/rotate-cloudflare-token.mjs
