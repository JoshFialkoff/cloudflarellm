# Lead Submitted Silence Alert
# Fires if lead_submitted count == 0 in the last 24 hours → Discord + CI failure.
#
# Secrets (repo → Settings → Actions):
#   POSTHOG_API_KEY — personal API key with query access
#   POSTHOG_PROJECT_ID — numeric project id
# Optional:
#   POSTHOG_HOST — default https://us.posthog.com
#   DISCORD_LEAD_SILENCE_WEBHOOK_URL — preferred webhook for this alert
#   DISCORD_ANALYTICS_WEBHOOK_URL — fallback
#   DISCORD_DAILY_ANALYTICS_WEBHOOK_URL — fallback
#   DISCORD_WEBHOOK_URL — fallback
#
# Schedule: every 6 hours (catches silence quickly without spamming)

name: Lead Submitted Silence Alert

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: lead-silence-alert-${{ github.repository }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check lead_submitted volume
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          DISCORD_LEAD_SILENCE_WEBHOOK_URL: ${{ secrets.DISCORD_LEAD_SILENCE_WEBHOOK_URL }}
          DISCORD_ANALYTICS_WEBHOOK_URL: ${{ secrets.DISCORD_ANALYTICS_WEBHOOK_URL }}
          DISCORD_DAILY_ANALYTICS_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_ANALYTICS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/ci/lead-submitted-silence-alert.mjs
