name = "smart-llm-router"
main = "smart-llm-router.js"
compatibility_date = "2026-08-27"

[vars]
ACCOUNT_ID = "ad9d77d8f16147c01ff26b56d41cb5a9"
GATEWAY_ID = "4-21-24-gateway"

[[kv_namespaces]]
binding = "ROUTER_KV"
id = "dbedcc63db6040bca9112a8625531a39"

[[secrets_store_secrets]]
binding = "CLOUDFLARE_API_KEY"
store_id = "5a4f5ebcb0ff480b90793336cd1d8240"
secret_name = "CLOUDFLARE_API_KEY"

# Cron Triggers run in UTC. 12:06 AM ET = 04:06 UTC (EDT, Mar–Nov) or 05:06 UTC (EST, Nov–Mar).
# Both are listed so the nightly run stays at ~12:06 AM ET year-round.
# The scheduled handler checks the actual ET time and only runs the refresh once per night.
[triggers]
crons = ["6 4 * * *", "6 5 * * *"]